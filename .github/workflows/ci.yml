# On each push, pull request and weekly (new Hyprland releases land without a push): in Arch
# Linux with the newest Hyprland, check the config and build every plugin. Warnings fail.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Arch packages
        run: pacman -Syu --noconfirm --needed base-devel hyprland
      - uses: actions/checkout@v5
      - name: Config
        run: |
          pacman -Q hyprland
          ./link.sh
          ./check.sh
      - name: Plugins
        shell: bash
        run: |
          set -euo pipefail
          for build in */build.sh; do
            echo "== $build"
            "./$build" 2>&1 | tee build.log
            if grep -q 'warning:' build.log; then echo "warnings in $build" >&2; exit 1; fi
          done
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck --shell=sh check.sh link.sh */build.sh
